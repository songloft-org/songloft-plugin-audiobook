name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          PKG_VER=$(node -p "require('./plugin.json').version")
          if [ "$PKG_VER" != "$VERSION" ]; then
            echo "❌ plugin.json version=$PKG_VER does not match tag=$VERSION"
            exit 1
          fi
          echo "✅ version aligned at $VERSION"

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"

          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            --title "${TAG}" \
            --generate-notes

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT


      - name: Push to public release repo
        id: public_repo
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "${RELEASE_REPO_TOKEN}" ]; then
            echo "⚠️ RELEASE_REPO_TOKEN not set, skipping cross-repo push"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          REPO="mimusic-org/mimusic-jsplugin-releases"
          BRANCH="audiobook"
          ZIP_NAME="audiobook.jsplugin.zip"

          # 1. 计算公共 URL
          RELEASE_TAG="audiobook-v${VERSION}"
          PUBLIC_DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          PUBLIC_UPDATE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/plugin.json"

          echo "public_download_url=${PUBLIC_DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "public_update_url=${PUBLIC_UPDATE_URL}" >> $GITHUB_OUTPUT

          # 2. 构建用于发布的 plugin.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.download_url = '${PUBLIC_DOWNLOAD_URL}';
            p.updateUrl = '${PUBLIC_UPDATE_URL}';
            fs.writeFileSync('plugin-for-public.json', JSON.stringify(p, null, 2) + '\n');
          "

          # 3. 【关键修复】克隆仓库
          # 方案：使用 HTTPS URL 并通过 GIT_ASKPASS 强制绕过凭据管理器
          REPO_URL="https://github.com/${REPO}.git"

          # 创建临时目录
          mkdir -p public-repo
          cd public-repo

          # 禁用全局的 extraheader (GitHub Actions 默认设置)
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # 克隆仓库（只克隆最新代码，不指定分支）
          git clone --no-checkout "${REPO_URL}" .

          # 【关键】设置本地配置，强制使用 Token 进行认证
          git config credential.helper ""
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # 检出代码
          # 如果是孤儿分支或者不存在，git checkout 会失败，我们捕获这个错误
          if ! git checkout "${BRANCH}" 2>/dev/null; then
            echo "⚠️ Branch '${BRANCH}' not found or invalid, creating orphan branch..."
            git checkout --orphan "${BRANCH}"
            git rm -rf .  # 清理可能存在的文件
          fi

          # 4. 复制文件并提交
          mkdir -p releases
          cp "../dist/${ZIP_NAME}" "releases/${ZIP_NAME}"
          cp "../plugin-for-public.json" "plugin.json"

          git add "releases/${ZIP_NAME}" "plugin.json"

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected, skipping push."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            git commit -m "release: audiobook v${VERSION}"

            # 【最终推送】使用 Token 强制推送
            # 这里的写法确保了即使凭据管理器存在，也会被 URL 中的 Token 覆盖
            git push "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/${REPO}.git" "${BRANCH}" --force

            echo "✅ Successfully pushed to ${BRANCH}"
          fi

          # 5. 在目标仓库创建 GitHub Release
          GH_TOKEN="${RELEASE_REPO_TOKEN}" gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            "../dist/${ZIP_NAME}" \
            --title "有声书 v${VERSION}" \
            --generate-notes \
            || echo "⚠️ Release ${RELEASE_TAG} may already exist, skipping"

      - name: Backfill download_url & updateUrl to private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer public repo URLs; fall back to private release if public push was skipped
          PUBLIC_DL="${{ steps.public_repo.outputs.public_download_url }}"
          PUBLIC_UP="${{ steps.public_repo.outputs.public_update_url }}"
          PRIVATE_DL="${{ steps.create_release.outputs.download_url }}"

          if [ -n "${PUBLIC_DL}" ]; then
            DOWNLOAD_URL="${PUBLIC_DL}"
            UPDATE_URL="${PUBLIC_UP}"
            echo "Using public repo URLs"
          else
            DOWNLOAD_URL="${PRIVATE_DL}"
            UPDATE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/plugin.json"
            echo "⚠️ Public repo push skipped, using private repo URLs"
          fi

          echo "download_url=${DOWNLOAD_URL}"
          echo "updateUrl=${UPDATE_URL}"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.download_url = '${DOWNLOAD_URL}';
            p.updateUrl = '${UPDATE_URL}';
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json
          git diff --staged --quiet || git commit -m "chore(release): backfill URLs for ${{ steps.version.outputs.tag }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ github.event.repository.default_branch }}
