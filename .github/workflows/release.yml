name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          PKG_VER=$(node -p "require('./plugin.json').version")
          if [ "$PKG_VER" != "$VERSION" ]; then
            echo "❌ plugin.json version=$PKG_VER does not match tag=$VERSION"
            exit 1
          fi
          echo "✅ version aligned at $VERSION"

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ENTRY_PATH=$(node -p "require('./plugin.json').entryPath")
          ZIP_NAME="${ENTRY_PATH}.jsplugin.zip"

          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            --title "${TAG}" \
            --generate-notes

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT

      - name: Backfill download_url and push
        run: |
          DOWNLOAD_URL="${{ steps.create_release.outputs.download_url }}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf-8'));
            p.download_url = '${DOWNLOAD_URL}';
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin.json
          git diff --staged --quiet || git commit -m "chore(release): add download_url for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
